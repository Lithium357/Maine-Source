name: Bug report
description: Report a reproducible app or collection problem. Never include credentials or private datasets.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: App and Windows version
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source and small public query, if relevant
      description: Do not paste API keys or private URLs.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual results
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before posting
      options:
        - label: I removed credentials, private content, and personal paths from this report.
          required: true
