name: Desktop checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm dist
      - name: Build legacy upgrade fixture
        shell: pwsh
        run: |
          $legacy = Join-Path $env:RUNNER_TEMP 'maine-source-legacy'
          New-Item -ItemType Directory -Path $legacy | Out-Null
          git archive f880e7ad0822a1849499d1e2beceabec9c5f260c --format=zip -o "$env:RUNNER_TEMP/legacy.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/legacy.zip" -DestinationPath $legacy
          Push-Location $legacy
          try {
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Legacy install failed' }
            pnpm dist
            if ($LASTEXITCODE -ne 0) { throw 'Legacy build failed' }
          } finally { Pop-Location }
      - name: Verify install, upgrade, embedded runtime, and uninstall
        shell: pwsh
        run: ./scripts/windows-lifecycle.ps1 -CurrentInstaller (Get-ChildItem release/*.exe | Select-Object -First 1).FullName -LegacyInstaller "$env:RUNNER_TEMP/maine-source-legacy/release/Maine Source Setup 0.1.5.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: maine-source-windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            THIRD-PARTY-NOTICES.txt
            release/windows-lifecycle-report.json
  reliability-soak:
    runs-on: windows-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Two-hour real-data replay with restart and outage injection
        run: node scripts/soak.mjs --minutes=120 --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maine-source-soak-report
          path: .test-data/soak-*/soak-report.json
          include-hidden-files: true
