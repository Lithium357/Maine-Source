name: Unsigned release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag matching package.json
        required: true
        type: string
permissions:
  contents: read
jobs:
  unsigned-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match package version' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Generate release notes with every source and API-key link
        run: node scripts/release-notes.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python API with source backend
        run: python -m unittest discover -s python/tests -v
      - run: pnpm test
      - run: pnpm audit --prod --audit-level=high
      - name: Build explicitly unsigned installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm dist
      - name: Test Python API with packaged Windows backend
        env:
          MAINE_SOURCE_TEST_APP: ${{ github.workspace }}/release/win-unpacked/Maine Source.exe
        run: python -m unittest discover -s python/tests -v
      - name: Build Python SDK wheel and checksums
        run: |
          python -m pip wheel ./python --no-deps --wheel-dir release
          if ($LASTEXITCODE -ne 0) { throw 'Python wheel build failed' }
          node scripts/checksums.mjs
      - name: Verify disclosure and unsigned installer
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            if ((Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne 'NotSigned') { throw 'Unexpected installer signature status' }
          }
          Copy-Item docs/UNSIGNED-RELEASE.txt release/UNSIGNED-RELEASE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: maine-source-unsigned-candidate
          path: |
            release/*.exe
            release/*.whl
            release/SHA256SUMS.txt
            release/RELEASE_NOTES.md
            release/UNSIGNED-RELEASE.txt
            THIRD-PARTY-NOTICES.txt
