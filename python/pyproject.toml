[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maine-source"
version = "0.3.0"
description = "Python API for the Maine Source desktop dataset collector"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["maine_source*"]
